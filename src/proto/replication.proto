syntax = "proto3";

package replication;

// ----- Vector clock ----------------------------------------------------

// A protobuf-native version vector: node-id → counter.
message VectorClock {
  map<string, uint64> entries = 1;
}

// ----- Top-level envelope ----------------------------------------------

message Envelope {
  oneof payload {
    Handshake       handshake         = 1;
    CrdtOp          crdt_op           = 4;
    CrdtPullRequest crdt_pull_request = 5;
  }
}

// ----- Handshake -------------------------------------------------------

message Handshake {
  // Globally unique node identifier (UUID recommended).
  string node_id   = 1;
  // Human-readable name (optional).
  string node_name = 2;
  // Protocol version for forward-compat checks.
  uint32 version   = 3;
  // If true, the sender is requesting that the receiver performs replica GC (implementation-defined).
  bool gc_replica = 4;
}

// ----- CRDT operations -------------------------------------------------

message CrdtOp {
  // Which CRDT instance this operation targets.
  string crdt_id = 1;
  // Opaque, serialised operation payload.  The CRDT layer will
  // deserialize this according to the crdt_id's registered type.
  bytes  payload = 2;
  // Originating node so we can break ties / attribute ops.
  string origin_node_id = 4;
  // Optional piggybacked VV request.  When present, the receiver should
  // respond with a delta since this knowledge vector, as if it had received
  // a separate CrdtPullRequest.
  VectorClock requester_knowledge = 5;

  // Optional knowledge matrix: node-id -> VectorClock.
  // proto3 doesn't support `optional map<...>` directly in a way that maps cleanly
  // to "Option<HashMap<...>>" in Rust prost, so we wrap the map in a message and
  // mark that wrapper as optional.
  message KnowledgeMatrix {
    map<string, VectorClock> entries = 1;
  }

  KnowledgeMatrix knowledge_matrix = 6;
}

// Pull request: asks the remote to send the delta since our knowledge vector.
message CrdtPullRequest {
  // Which CRDT instance this pull targets.
  string crdt_id = 1;
  // Originating node.
  string origin_node_id = 2;

  // Protobuf-encoded knowledge map.
  VectorClock knowledge = 3;

  // If true, request that the remote performs replica GC (implementation-defined).
  bool gc_replica = 4;
}

// ----- CRDT delta / op wire types -------------------------------------

// A single causal event identifier (node, counter).
message ProtoDot {
  string node_id = 1;
  uint64 counter = 2;
}

// One (element-bytes, dot) entry inside an OR-Set delta.
message ProtoElemDot {
  bytes   element = 1;
  ProtoDot dot    = 2;
}

// A tombstone pair: the add-event dot and the remove-event dot.
message ProtoDotPair {
  ProtoDot add_dot    = 1;
  ProtoDot remove_dot = 2;
}

// Wire representation of OrSetDelta<E>.
// Elements are opaque bytes; the concrete CRDT impl encodes/decodes them.
message ProtoOrSetDelta {
  repeated ProtoElemDot  adds       = 1;
  repeated ProtoDotPair  tombstones = 2;
  map<string, uint64>    context    = 3;
  string                 dot_node   = 4;
  uint64                 dot_counter = 5;
}

// Wire representation of OrSetOp<E>.
message ProtoOrSetOp {
  oneof op {
    bytes add_element    = 1;
    bytes remove_element = 2;
  }
}

// ----- Client commands ------------------------------------------------

// Commands sent from the CLI client to the server over TCP.
message ProtoClientCommand {
  oneof command {
    string add             = 1;
    string remove          = 2;
    bool   print_state     = 3;
    bool   print_internals = 4;
    bool   print_matrix    = 5;
  }
}
