      NODE_NAME: gc-server-2
      LISTEN_HOST: gc-server-2
      LISTEN_PORT: "9000"
      CLIENT_PORT: "9100"
      DISCOVERY_CONNECT_NODE_IDS: normal-server-1,normal-server-2,normal-server-7,normal-server-10,normal-server-11,normal-server-12,gc-server-1,gc-server-3,gc-server-4,gc-server-5
      GC_REPLICA: "true"
    ports:
