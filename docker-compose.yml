version: "3.9"

x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
  S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
  HOST_IP: ${HOST_IP}

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console

    env_file:
      - .env

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 20s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  # GC replica — S1
  gc-server-1:
    build: .
    image: crdt-server:latest
    restart: unless-stopped
    networks:
      - crdt-net
    environment:
      <<: *s3-env
      NODE_NAME: gc-server-1
      LISTEN_HOST: gc-server-1
      LISTEN_PORT: "9000"
      CLIENT_PORT: "9100"
      DISCOVERY_CONNECT_NODE_IDS: normal-server-1,normal-server-5,normal-server-6,normal-server-9,normal-server-11,normal-server-15,gc-server-2,gc-server-3,gc-server-4,gc-server-5
      GC_REPLICA: "true"
    ports:
      - "9110:9000"
      - "9111:9100"
    depends_on:
      minio:
        condition: service_healthy

  # GC replica — S2
  gc-server-2:
    image: crdt-server:latest
    restart: unless-stopped
    networks:
      - crdt-net
