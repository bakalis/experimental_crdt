x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
  S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
  METRICS_FILE_PATH: ${METRICS_FILE_PATH}

services:
  experiment-1:
    build:
      context: .
      dockerfile: experiment.dockerfile
    image: crdt-experiment:latest
    restart: unless-stopped
    networks:
      - crdt-net
    environment:
      <<: *s3-env
      LISTEN_HOST: machine1.home
      LISTEN_PORT: "9000"
      CLIENT_PORT: "9100"
      NUM_GC_REPLICAS: 2
      NUM_NORMAL_REPLICAS: 8
    volumes:
      - ./logs/experiment-1/:/logs/
    ports:
      - "9110:9000"
      - "9111:9100"

volumes:
  minio-data:

networks:
  crdt-net:
    driver: bridge
