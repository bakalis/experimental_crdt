[package]
name    = "crdt-replication"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "crdt-server"
path = "src/main.rs"

[[bin]]
name = "crdt-client"
path = "src/client/crdt_client.rs"

[dependencies]
tokio       = { version = "1", features = ["full"] }
prost       = "0.13"
prost-types = "0.13"
bytes       = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid        = { version = "1", features = ["v4"] }
clap        = { version = "4", features = ["derive", "env"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
dashmap     = "6"
anyhow      = "1"
dotenvy     = "0.15"
async-trait = "0.1"                              # ← NEW
rand        = "0.8"

# S3 / MinIO
aws-config          = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3          = "1"
aws-credential-types = "1"
aws-types           = "1"

# Timestamps for registration heartbeat
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
prost-build = "0.13"
